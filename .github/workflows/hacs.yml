name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # The brands check requires the `techem` domain to exist in
          # home-assistant/brands, which needs a separate pull request to that
          # repository with an icon and logo. Drop this ignore once that lands.
          ignore: "brands"
